    - MS
    - AXP
    - BLK
    - SCHW
    - V
    - MA
    - PYPL
    # ---- Consumer ----
    - COST
    - WMT
    - HD
    - LOW
    - MCD
    - SBUX
    - NKE
    - TGT
    - PG
    - KO
    - PEP
    - MDLZ
    - COLM
    - LULU
    # ---- Industrials / energy ----
    - CAT
    - GE
    - HON
    - BA
    - RTX
    - UPS
    - FDX
    - XOM
    - CVX
    - COP
    - EOG
    - SLB
    # ---- Healthcare ----
    - LLY
    - UNH
    - JNJ
    - PFE
    - MRK
    - ABBV
    - TMO
    - ABT
    - DHR
    - AMGN
    - GILD
    # ---- Growth / momentum names commonly held ----
    - PLTR
