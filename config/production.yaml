# --- Data feeds ---
alpaca:
  feed: iex                                # 15-min delayed
  bar_timeframes: ["1Day"]                 # sub-day excluded; see §2.4
  history_bars: 252                        # ~1 year of daily bars

yahoo:
  fundamentals_ttl_days: 20                # match §1.3 halflife
  # Enabled: fundamentals feed the Bayesian's fundamental-quality group.
  # curl_cffi + per-symbol timeouts + stale-cache fallback prevent hangs.
  enabled: true
  max_workers: 4
  per_symbol_timeout_seconds: 8.0

# --- Database ---
database:
  host: ${DB_HOST:-questdb}
  port: ${DB_PORT:-8812}
  user: ${DB_USER:-admin}
  password: ${DB_PASSWORD:-quest}
  name: ${DB_NAME:-qdb}

# --- Logging ---
logging:
  level: ${LOG_LEVEL:-INFO}
  format: json
  file: /app/logs/juniauto.log
  rotation: daily

# --- Metrics ---
metrics:
  enabled: true
  port: 9091
  interval_seconds: 60
